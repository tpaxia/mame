<?xml version="1.0"?>
<!-- Windows/macOS host UI only: F12 toggles UI; no M40 keyboard bindings. -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="UI_TOGGLE_UI">
                <newseq type="standard">KEYCODE_F12 NOT KEYCODE_LSHIFT NOT KEYCODE_RSHIFT NOT KEYCODE_LCONTROL NOT KEYCODE_RCONTROL NOT KEYCODE_LALT NOT KEYCODE_RALT</newseq>
            </port>
            <port type="UI_SNAPSHOT">
                <newseq type="standard">NONE</newseq>
            </port>
        </input>
    </system>
</mameconfig>
